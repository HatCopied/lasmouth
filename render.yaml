services:
  - type: web
    name: lastmonth
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Cole aqui sua API Key do Last.fm (ou, melhor ainda, deixe em branco
      # neste arquivo e defina o valor manualmente no painel do Render em
      # Environment -> Add Environment Variable, marcando como "secret").
      # Sem essa variável, o site funciona normalmente, mas cada visitante
      # precisa colar a própria API Key para gerar o card.
      - key: LASTFM_DEFAULT_API_KEY
        sync: false
