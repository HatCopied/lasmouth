<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Antes este arquivo tinha um <alias> forçando "Segoe UI" a preferir
    "Segoe UI Variable" -- era exatamente essa troca que fazia o
    fontconfig tentar resolver os pesos (bold/black) a partir da fonte
    variável, de forma inconsistente dentro do container.

    Agora que os pesos são resolvidos por @font-face explícito no
    fonts.css (direto pela página, sem depender do SO), este arquivo
    não precisa mais fazer esse alias. Ele fica só registrando as
    fontes estáticas no cache do fontconfig, como rede de segurança
    para qualquer outro processo do sistema que precise localizá-las
    fora do navegador.
  -->
</fontconfig>
